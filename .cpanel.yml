---
deployment:
  tasks:
    # Ajustar DEPLOYPATH al docroot real que muestre cPanel al crear el subdominio.
    # Default de cPanel para el subdominio "staging": /home2/jumperss/staging.jumperssori.com/
    - export DEPLOYPATH=/home2/jumperss/staging.jumperssori.com/
    - /bin/cp -R index.html "$DEPLOYPATH"
    - /bin/cp -R assets "$DEPLOYPATH" 2>/dev/null || true
