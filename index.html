<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro Infantil Bilingüe Jumperssori</title>
<meta name="description" content="Centro infantil bilingüe en El Alto, Bolivia. Tus hijos aprenden jugando, en dos idiomas.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Centro Infantil Bilingüe Jumperssori">
<meta property="og:description" content="Tus hijos aprenden jugando, en dos idiomas. Centro infantil bilingüe en El Alto, inspirado en Montessori.">
<meta property="og:url" content="https://jumperssori.com/">
<meta property="og:image" content="https://jumperssori.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_BO">
<meta property="og:site_name" content="Jumperssori">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/logo-nav.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja:#FF914D; --naranja-d:#ec6f28; --tinta:#33302b;
    --grad:linear-gradient(to top right,#FFFEFA,#9ecfee,#5FA7DA);
    --fg:#2c6996; --fg-soft:rgba(51,48,43,.82); --line:#2c6996;
    --tg-bg:rgba(255,255,255,.8); --tg-fg:#33302b; --tg-border:rgba(255,255,255,.6);
    --display:'Baloo 2',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  }
  html.dark{
    --grad:linear-gradient(to top right,#0a1f2e,#123a52,#2c6996);
    --fg:#fff; --fg-soft:rgba(255,255,255,.82); --line:#fff;
    --tg-bg:rgba(255,255,255,.1); --tg-fg:#fff; --tg-border:rgba(255,255,255,.2);
  }
  *{margin:0;box-sizing:border-box}
  body{font-family:var(--body);min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  #particles-js{position:fixed;inset:0;z-index:0;background:var(--grad);transition:background .5s ease}
  #particles-js canvas{position:absolute;top:0;left:0}
  .toggle{position:fixed;top:16px;right:16px;z-index:20;font-family:var(--display);font-weight:600;font-size:.9rem;
    background:var(--tg-bg);color:var(--tg-fg);backdrop-filter:blur(8px);padding:.55em 1.1em;border-radius:999px;
    border:2px solid var(--tg-border);cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);
    transition:transform .15s ease,background .3s ease,color .3s ease}
  .toggle:active{transform:scale(.95)}
  .l-light{display:none} html.dark .l-dark{display:none} html.dark .l-light{display:inline}
  main{position:relative;z-index:10;min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 24px}
  .logo{height:64px;width:auto;margin-bottom:32px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.1;
    max-width:16ch;color:var(--fg);text-shadow:0 2px 10px rgba(0,0,0,.15)}
  .sub{margin-top:20px;font-size:clamp(1.05rem,2vw,1.3rem);max-width:36ch;color:var(--fg-soft)}
  .actions{margin-top:32px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--display);font-weight:600;font-size:1.02rem;padding:.8em 1.7em;border-radius:999px;
    cursor:pointer;text-decoration:none;display:inline-block;transition:transform .18s ease,background .2s ease}
  .btn-p{background:var(--naranja);color:var(--tinta);box-shadow:0 5px 0 var(--naranja-d)}
  .btn-p:active{transform:translateY(3px);box-shadow:0 1px 0 var(--naranja-d)}
  .btn-line{border:2.5px solid var(--line);color:var(--fg)}
  @media(hover:hover) and (pointer:fine){.btn-p:hover{background:#ffa066}.btn-line:hover{background:rgba(255,255,255,.15)}}
  @media(min-width:640px){.logo{height:80px}}
  @media(prefers-reduced-motion:reduce){#particles-js{transition:none}.btn:active,.toggle:active{transform:none}}
</style>
</head>
<body>
  <div id="particles-js"></div>

  <button class="toggle" id="toggle" aria-label="Alternar modo claro y oscuro">
    <span class="l-dark">🌙 Modo oscuro</span><span class="l-light">☀️ Modo claro</span>
  </button>

  <main>
    <img class="logo" src="assets/logo-nav.png" alt="Jumperssori" width="925" height="395" fetchpriority="high">
    <h1>Espacio para crecer, libertad para aprender.</h1>
    <p class="sub">Un centro infantil bilingüe, cálido y seguro, inspirado en Montessori.</p>
    <div class="actions">
      <a class="btn btn-p" href="https://wa.me/59175322827?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20Jumperssori" target="_blank" rel="noopener">Contáctanos</a>
      <a class="btn btn-line" href="sitio.html">Ir al sitio</a>
    </div>
  </main>

  <script>
    // Toggle claro/oscuro (inmediato)
    document.getElementById("toggle").addEventListener("click", function(){
      document.documentElement.classList.toggle("dark");
    });
  </script>
  <!-- Partículas: decorativas, cargan después sin bloquear el render -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js" defer></script>
  <script>
    window.addEventListener("load", function(){
      if (!window.particlesJS) return;
      particlesJS("particles-js", {
        particles: {
          number: { value: 120, density: { enable: true, value_area: 900 } },
          color: { value: ["#5FA7DA", "#FFE680", "#FF914D", "#5CB693"] },
          shape: { type: "circle" },
          opacity: { value: 0.7, random: true, anim: { enable: true, speed: 0.8, opacity_min: 0.25, sync: false } },
          size: { value: 3, random: true },
          line_linked: { enable: true, distance: 150, color: "#5FA7DA", opacity: 0.4, width: 1 },
          move: { enable: true, speed: 1.2, direction: "none", random: true, straight: false, out_mode: "out" }
        },
        interactivity: {
          detect_on: "window",
          events: { onhover: { enable: true, mode: "bubble" }, onclick: { enable: true, mode: "bubble" }, resize: true },
          modes: { bubble: { distance: 200, size: 9, duration: 2, opacity: 1, speed: 3 }, push: { particles_nb: 4 } }
        },
        retina_detect: true
      });
    });
  </script>
</body>
</html>
